# Tiny Tapeout project information
yaml_version: 6

project:
  title:        "PWM Generator"
  author:       "Timur"
  discord:      ""
  description:  "8-bit PWM generator"
  language:     "Verilog"
  clock_hz:     10000000

  # How many tiles does your project need?
  tiles:        "1x1"

  # Top module name (must match module name in src/project.v)
  top_module:   "tt_um_pwm_generator"

  # List of Verilog source files
  source_files:
    - "project.v"

# Pinout configuration
pinout:
  ui[0]: "duty[0]"
  ui[1]: "duty[1]"
  ui[2]: "duty[2]"
  ui[3]: "duty[3]"
  ui[4]: "duty[4]"
  ui[5]: "duty[5]"
  ui[6]: "duty[6]"
  ui[7]: "duty[7]"

  uo[0]: "pwm_out"
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
